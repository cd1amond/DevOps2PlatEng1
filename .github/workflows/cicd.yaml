name: cicd

on:
  workflow_dispatch:
  push:
    paths:
      - src/**
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Shorten commit id
        shell: bash
        run: |
          echo "COMMIT_ID=${GITHUB_SHA::6}" >> "$GITHUB_ENV"
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push
        uses: docker/build-push-action@v6
        with:
          push: true
          tags: cdiamond/python-app:${{ env.COMMIT_ID }}
      -
        name: Update image tag in Helm values
        shell: bash
        run: |
          yq -i '.image.tag = strenv(COMMIT_ID)' charts/python-app/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add charts/python-app/values.yaml
          git commit -m "chore: deploy image ${COMMIT_ID}"
          git push
    outputs:
      commit_id: ${{ env.COMMIT_ID }}

  cd:
    needs: ci
    runs-on: self-hosted
    steps:
      -
        name: Show deployed commit
        shell: bash
        run: |
          echo "Deploying commit ${{ needs.ci.outputs.commit_id }}"
      -
        name: Install argocd CLI
        shell: bash
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/download/v2.13.6/argocd-linux-arm64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/argocd
      -
        name: ArgoCD app sync
        shell: bash
        run: |
          argocd login argocd-server.argocd \
          --insecure  \
          --grpc-web  \
          --username  ${{ secrets.ARGOCD_USERNAME }} \
          --password  ${{ secrets.ARGOCD_PASSWORD }}
          argocd app sync python-app

